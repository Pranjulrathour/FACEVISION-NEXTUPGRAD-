services:
  postgres:
    image: postgres:16-alpine
    container_name: facevision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: facevision
      POSTGRES_PASSWORD: facevision
      POSTGRES_DB: facevision
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facevision -d facevision"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - facevision-net

  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: facevision-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://facevision:facevision@postgres:5432/facevision
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: http://localhost:3000,http://localhost:80,http://localhost
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../backend:/app
    networks:
      - facevision-net
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.frontend
    container_name: facevision-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - facevision-net

  nginx:
    image: nginx:1.27-alpine
    container_name: facevision-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - facevision-net

volumes:
  postgres_data:
    name: facevision_postgres_data

networks:
  facevision-net:
    driver: bridge
    name: facevision-net
